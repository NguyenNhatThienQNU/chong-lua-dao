<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Trung tâm Chống lừa đảo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Học liệu số tương tác cho tiết 1, Bài 9 Tin học 11: Giao tiếp an toàn trên Internet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a security-operations console. One sticky command bar, one stage per lesson module; caution-tape yellow marks case files and evidence. */
:root{
  --bg:#EDF1F6;
  --panel:#FFFFFF;
  --panel-2:#F4F6FA;
  --ink:#0E1726;
  --muted:#556174;
  --line:#D3DAE4;
  --tape:#FFC72C;
  --tape-ink:#141414;
  --danger:#C42A1E;
  --danger-soft:#FCE8E6;
  --safe:#067647;
  --safe-soft:#E1F3EA;
  --info:#1F4FD1;
  --info-soft:#E6ECFB;
  --warn:#9A4A00;
  --warn-soft:#FFF0DA;
  --screen:#0B1320;
  --screen-bg:#F8F9FB;
  --bubble:#E8ECF2;
  --bubble-ink:#111A2A;
  --alarm:#C42A1E;
  --alarm-ink:#FFFFFF;
  --alarm-hl:rgba(255,255,255,.24);
  --qr-bg:#FFFFFF;
  --shadow:0 1px 2px rgba(14,23,38,.06),0 10px 28px rgba(14,23,38,.09);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F18;--panel:#121A27;--panel-2:#182233;--ink:#E7ECF4;--muted:#9AA6B8;--line:#28344B;
    --danger:#FF6B5D;--danger-soft:#3B1714;--safe:#3DD08F;--safe-soft:#0E2C20;--info:#8AABFF;--info-soft:#16233F;
    --warn:#FFB54D;--warn-soft:#36260B;--screen:#04070C;--screen-bg:#101826;--bubble:#1F2A3D;--bubble-ink:#E6EAF1;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F18;--panel:#121A27;--panel-2:#182233;--ink:#E7ECF4;--muted:#9AA6B8;--line:#28344B;
  --danger:#FF6B5D;--danger-soft:#3B1714;--safe:#3DD08F;--safe-soft:#0E2C20;--info:#8AABFF;--info-soft:#16233F;
  --warn:#FFB54D;--warn-soft:#36260B;--screen:#04070C;--screen-bg:#101826;--bubble:#1F2A3D;--bubble-ink:#E6EAF1;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4);color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:clamp(18px,.58vw + 13px,24px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.ic{width:1.2em;height:1.2em;flex:none}
.wrap{max-width:1480px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:.94rem}
.mono{font-family:var(--f-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.04;margin:0;text-wrap:balance}
h1{font-size:clamp(2.4rem,4.8vw,4.3rem);text-transform:uppercase;letter-spacing:.01em}
h2{font-size:clamp(1.85rem,3vw,2.75rem)}
h3{font-size:clamp(1.38rem,1.85vw,1.72rem)}
p{margin:0}
ul,ol{margin:0}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* command bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel)}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px}
.tape{height:6px;background:repeating-linear-gradient(-45deg,var(--tape) 0 12px,var(--tape-ink) 12px 24px)}
.brand{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;border-radius:10px}
.brand:focus-visible{outline:3px solid var(--info)}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--tape);color:var(--tape-ink);display:grid;place-items:center;flex:none}
.brand-t{font-family:var(--f-display);font-weight:800;font-size:1.22rem;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.brand-s{font-size:.72rem;color:var(--muted);line-height:1.25}
.nav{display:flex;gap:4px;overflow-x:auto;min-width:0;flex:1 1 380px;scrollbar-width:none;padding-block:2px}
.nav::-webkit-scrollbar{display:none}
.nav button{all:unset;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;padding:.45em .88em;border-radius:999px;font-weight:700;font-size:.98rem;color:var(--muted)}
.nav button:hover{color:var(--ink);background:var(--panel-2)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--panel)}
.nav button:focus-visible{outline:3px solid var(--info)}
.nav .num{font-family:var(--f-mono);font-size:.86rem;opacity:.85}
.tools{display:flex;gap:6px;align-items:center;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:.42em .75em;font-weight:800;font-size:.82rem;color:var(--muted);letter-spacing:.03em}
.seg button[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink)}
.seg button:focus-visible{outline:3px solid var(--info);outline-offset:-3px}
.ibtn{all:unset;cursor:pointer;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;background:var(--panel-2)}
.ibtn:hover{border-color:var(--muted)}
.ibtn:focus-visible{outline:3px solid var(--info)}
@media (max-width:760px){.nav{order:3;flex-basis:100%}.brand-s{display:none}}

main{padding-block:clamp(18px,2.6vw,34px) 56px}
.mod{display:flex;flex-direction:column;gap:clamp(14px,2vw,22px)}
.mod-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,1.8vw,22px);min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(14px,2vw,24px);align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.brief{font-size:1.15rem;font-weight:500;max-width:76ch}
details.gv{border:1px dashed var(--line);border-radius:12px;background:var(--panel-2);padding:.6rem 1rem;font-size:.98rem}
details.gv summary{cursor:pointer;font-weight:700}
details.gv ol{padding-left:1.2rem;margin-top:.5rem;display:grid;gap:4px}
.mode-hs .gv-only{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:.62em 1.08em;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:1.02rem;cursor:pointer;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.btn.tapebtn{background:var(--tape);border-color:var(--tape);color:var(--tape-ink)}
.btn.big{font-size:1.18rem;padding:.75em 1.35em;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{width:100%;min-width:0;padding:.65em .85em;border-radius:12px;border:1px solid var(--line);background:var(--panel-2)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(16px,3vw,40px);align-items:center}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .tag{font-size:clamp(1.08rem,1.5vw,1.4rem);font-weight:500;max-width:38ch}
.hero .tag b{font-weight:800}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.modcard{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-height:150px;transition:transform .15s,border-color .15s}
.modcard:hover{transform:translateY(-2px);border-color:var(--ink)}
.modcard:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.modcard .n{font-family:var(--f-mono);font-weight:700;font-size:.94rem;color:var(--muted)}
.modcard .t{font-family:var(--f-display);font-weight:800;font-size:1.72rem;line-height:1.04}
.modcard .s{font-size:.92rem;font-weight:700;color:var(--warn)}
.modcard .d{font-size:1rem;color:var(--muted)}
.qrover{position:fixed;inset:0;z-index:80;background:#fff;color:#0f172a;display:grid;place-items:center;padding:3vmin;cursor:zoom-out}
.qo-wrap{display:flex;flex-direction:column;align-items:center;gap:2.4vmin;text-align:center}
.qrover.wide .qo-wrap{flex-direction:row;gap:5vw;text-align:left}
.qo-code{padding:2.2vmin;border:3px solid #0f172a;border-radius:2.4vmin;background:#fff;line-height:0}
.qo-code canvas{display:block}
.qo-side{display:flex;flex-direction:column;gap:2vmin;max-width:min(42vw,640px)}
.qrover:not(.wide) .qo-side{max-width:90vw;align-items:center}
.qo-eb{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#64748b;font-size:clamp(.8rem,1.5vmin,1.1rem)}
.qo-t{font-family:var(--f-display);font-weight:800;line-height:.95;font-size:clamp(2rem,7.5vmin,5.6rem);text-transform:uppercase}
.qrover:not(.wide) .qo-t br{display:none}
.qo-lop{align-self:flex-start;background:var(--tape);color:var(--tape-ink);font-family:var(--f-display);font-weight:800;font-size:clamp(1.1rem,3.4vmin,2.2rem);padding:.15em .6em;border-radius:10px}
.qrover:not(.wide) .qo-lop{align-self:center}
.qo-steps{margin:0;padding-left:1.3em;display:grid;gap:.5em;font-size:clamp(1rem,2.6vmin,1.6rem);text-align:left}
.qo-l{font-size:clamp(.85rem,2vmin,1.2rem);color:#334155;overflow-wrap:anywhere;background:#f1f5f9;border-radius:10px;padding:.5em .8em}
.qo-h{font-size:clamp(.75rem,1.5vmin,.95rem);color:#94a3b8}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrbox canvas{width:168px;height:168px;background:var(--qr-bg);border-radius:12px;padding:8px;flex:none}
.qrempty{width:168px;height:168px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:.78rem;color:var(--muted);padding:10px;flex:none}

/* device mockups */
.phone{width:min(100%,415px);margin-inline:auto;background:var(--screen);border-radius:40px;padding:10px;box-shadow:var(--shadow)}
.phone.big{width:min(100%,450px)}
.phone .scr{background:var(--screen-bg);border-radius:31px;overflow:hidden;display:flex;flex-direction:column;min-height:min(540px,68vh)}
.phone.big .bub,.phone.big .mail-body{font-size:clamp(1.05rem,1.45vw,1.3rem)}
.status{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 6px;font-size:.88rem;font-weight:700;color:var(--muted)}
.sig{display:inline-flex;align-items:flex-end;gap:2px;height:10px}
.sig i{display:block;width:3px;background:currentColor;border-radius:1px}
.sig i:nth-child(1){height:3px}.sig i:nth-child(2){height:5px}.sig i:nth-child(3){height:7px}.sig i:nth-child(4){height:10px}
.ahead{display:flex;align-items:center;gap:10px;padding:8px 14px 12px;border-bottom:1px solid var(--line)}
.who{min-width:0}
.nm{font-weight:800;font-size:1.08rem;line-height:1.25}
.sub{font-size:.88rem;color:var(--muted);line-height:1.3}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--info);color:var(--panel);flex:none}
.avatar.big{width:68px;height:68px;font-size:1.5rem}
.av-warn{background:var(--warn)}.av-danger{background:var(--danger)}.av-muted{background:var(--muted)}.av-safe{background:var(--safe)}
.abody{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}
.daytag{align-self:center;font-size:.86rem;color:var(--muted);font-weight:700}
.bub{background:var(--bubble);color:var(--bubble-ink);border-radius:18px 18px 18px 6px;padding:11px 14px;max-width:96%;font-size:1.08rem;font-weight:500;line-height:1.45;overflow-wrap:anywhere}
.lnk{color:var(--info);text-decoration:underline;text-underline-offset:2px}
.mail{display:flex;flex-direction:column;gap:10px}
.mail-from{display:flex;gap:10px;align-items:center}
.mail-sub{font-weight:800;font-size:1.15rem;line-height:1.3}
.mail-body{font-size:1.08rem;line-height:1.48}
.callhead{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 14px;border-bottom:1px solid var(--line);text-align:center}
.callnum{font-family:var(--f-mono);font-weight:800;font-size:1.18rem}
.video{position:relative;margin:10px 14px 0;border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:linear-gradient(160deg,var(--muted),var(--screen));display:grid;place-items:center}
.vid-face{display:grid;place-items:center;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 50% 38%,var(--panel-2),var(--muted));filter:blur(5px);font-weight:800;font-size:1.6rem;color:var(--ink)}
.vid-cap{position:absolute;left:10px;right:10px;bottom:10px;font-size:.92rem;font-weight:700;color:var(--alarm-ink);text-align:center}
.feedhead{padding:4px 14px 10px;font-weight:800;border-bottom:1px solid var(--line)}
.post{padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.post-h{display:flex;gap:10px;align-items:center}
.post-img{aspect-ratio:16/9;border-radius:12px;background:repeating-linear-gradient(45deg,var(--panel-2) 0 10px,var(--bubble) 10px 20px);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--muted);letter-spacing:.06em}
.post-link{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--panel-2);font-family:var(--f-mono);font-size:.96rem;font-weight:700;flex-wrap:wrap}
.cta{font-family:var(--f-body);font-weight:800;background:var(--info);color:var(--panel);padding:.3em .7em;border-radius:8px;white-space:nowrap}
.cert{display:block;border:3px double var(--danger);padding:10px;border-radius:6px;text-align:center;font-family:var(--f-display);font-weight:800;letter-spacing:.04em;color:var(--danger);background:var(--panel)}
.cert small{display:block;font-family:var(--f-body);font-weight:600;letter-spacing:0;color:var(--muted)}
.laptop{width:min(100%,660px);margin-inline:auto}
.lap-scr{background:var(--screen);border-radius:18px 18px 4px 4px;padding:12px 12px 14px;box-shadow:var(--shadow)}
.browser{background:var(--screen-bg);border-radius:8px;overflow:hidden}
.tabbar{display:flex;padding:6px 8px 0;background:var(--panel-2)}
.tabx{font-size:.88rem;font-weight:700;padding:6px 12px;border-radius:8px 8px 0 0;background:var(--screen-bg)}
.urlbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.98rem;font-weight:700;flex-wrap:wrap}
.nosec{font-size:.86rem;font-weight:800;color:var(--danger)}
.alarm{background:var(--alarm);color:var(--alarm-ink);padding:18px;display:flex;flex-direction:column;gap:10px;text-align:center}
.alarm-h{font-family:var(--f-display);font-weight:800;font-size:1.85rem;letter-spacing:.04em}
.alarm-big{font-size:1.28rem;font-weight:800}
.alarm-small{font-size:.98rem;font-weight:700}
.lap-base{height:14px;background:var(--muted);opacity:.55;border-radius:0 0 16px 16px}
.followup{margin:14px auto 0;display:flex;flex-direction:column;gap:8px;max-width:620px}

/* hotspots */
.hs{cursor:inherit;outline:none;-webkit-tap-highlight-color:transparent;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .2s}
.hs.block{display:block}
.hs.face{display:inline-block;border-radius:50%;position:relative}
.hs.face.found::after{position:absolute;top:2px;right:2px;margin:0}
.hint .hs:not(.found){outline:2px dashed var(--warn);outline-offset:1px}
.hs.found{background:var(--danger-soft);box-shadow:inset 0 -2px 0 var(--danger)}
.hs.found::after{content:attr(data-n);display:inline-grid;place-items:center;width:1.35em;height:1.35em;margin-left:.3em;border-radius:50%;background:var(--danger);color:var(--panel);font:800 .7rem var(--f-body);vertical-align:.12em}
.hs.missed{outline:2px dashed var(--danger);outline-offset:1px}
.alarm .hs.found{background:var(--alarm-hl);outline-color:var(--alarm-ink)}
.alarm .hs.found{box-shadow:inset 0 -3px 0 var(--alarm-ink)}
.alarm .hs.found::after{background:var(--alarm-ink);color:var(--alarm)}
.video .hs.found{background:var(--alarm-hl);outline-color:var(--alarm-ink)}
.video .hs.found{box-shadow:inset 0 -3px 0 var(--alarm-ink)}

/* warm-up stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(16px,3vw,48px);align-items:center}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}
.stage-phone{position:relative}
.stage .phone .scr{min-height:min(430px,56vh)}
@media (min-width:861px){.stage{grid-template-columns:minmax(0,1.15fr) minmax(0,1.05fr);gap:clamp(20px,3vw,52px)}}
.stage .phone.big{width:min(100%,760px);border-radius:48px;padding:12px}
.stage .phone .scr{border-radius:38px;min-height:min(380px,50vh)}
.stage .phone.big .bub,.stage .phone.big .mail-body{font-size:clamp(1.35rem,2.35vw,2.4rem);line-height:1.35}
.stage .phone.big .bub{max-width:100%;padding:.55em .75em}
.stage .mail-from .nm{font-size:clamp(1.1rem,1.6vw,1.6rem)}
.stage .status{font-size:clamp(.85rem,1.1vw,1.1rem);padding:14px 30px 8px}
.stage .sig{height:14px}.stage .sig i{width:4px}
.stage .ahead{padding:12px 22px 16px;gap:14px}
.stage .avatar{width:clamp(44px,4vw,64px);height:clamp(44px,4vw,64px);font-size:clamp(1rem,1.5vw,1.4rem)}
.stage .nm{font-size:clamp(1.15rem,1.75vw,1.75rem)}
.stage .sub{font-size:clamp(.85rem,1.1vw,1.1rem)}
.stage .daytag{font-size:clamp(.8rem,1vw,1rem)}
.stage .abody{padding:18px 22px 24px;gap:14px}
.stage .mail-sub{font-size:clamp(1.25rem,2vw,2rem)}
.stage .ringbox{width:min(270px,56vw)}
.stage .lg{font-size:clamp(1rem,1.3vw,1.3rem)}
.stage .dots span{width:16px;height:16px}
.veil .scr > :not(.status){filter:blur(12px)}
.veil-cover{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.veil-cover span{background:var(--tape);color:var(--tape-ink);font-family:var(--f-display);font-weight:800;font-size:1.7rem;padding:.15em .7em;border-radius:10px;text-transform:uppercase;letter-spacing:.04em}
.stage-side{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.ringbox{position:relative;width:min(230px,56vw);aspect-ratio:1}
.ringbox svg{width:100%;height:100%;display:block}
.ring-bg{fill:none;stroke:var(--line);stroke-width:10}

.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.raise{position:fixed;inset:0;display:grid;place-items:center;z-index:40;pointer-events:none;animation:raise 1.7s ease forwards}
.raise div{font-family:var(--f-display);font-weight:800;font-size:clamp(4rem,14vw,11rem);text-transform:uppercase;background:var(--tape);color:var(--tape-ink);padding:.02em .4em;border-radius:18px;box-shadow:0 0 0 10px var(--tape-ink)}
@keyframes raise{0%{opacity:0;transform:scale(1.35)}14%{opacity:1;transform:scale(1)}72%{opacity:1}100%{opacity:0}}
.stamp{display:inline-block;font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(2.3rem,5vw,3.8rem);letter-spacing:.04em;border:5px solid currentColor;border-radius:12px;padding:0 .35em;transform:rotate(-5deg);animation:stamp .35s ease-out both}

@keyframes stamp{from{opacity:0;transform:scale(1.7) rotate(-5deg)}to{opacity:1;transform:scale(1) rotate(-5deg)}}
.reasons{text-align:left;display:flex;flex-direction:column;gap:clamp(12px,1.5vw,22px);max-width:min(95vw,720px);padding-left:clamp(1.4rem,2vw,2.4rem);font-size:clamp(1.35rem,2.15vw,2.4rem);line-height:1.45;font-weight:600;color:var(--ink)}.reasons li{padding-left:.25em}.reasons li::marker{color:var(--tape-ink);font-weight:800;font-size:1.1em}
.real{border-left:5px solid var(--tape);padding:clamp(.7em,1.3vw,1.15em) clamp(.9em,1.6vw,1.45em);background:var(--panel-2);border-radius:0 14px 14px 0;text-align:left;font-size:clamp(1.15rem,1.65vw,1.75rem);line-height:1.44;max-width:min(95vw,720px);margin-top:clamp(10px,1.4vw,20px)}.real .eyebrow{font-size:clamp(.85rem,1.15vw,1.15rem);font-weight:800;letter-spacing:.06em}
.twist{display:flex;flex-direction:column;gap:16px;max-width:980px}
.twist .lead{font-size:clamp(1.15rem,1.7vw,1.5rem);font-weight:500;max-width:52ch}
.qbox{padding:.8em 1em;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);font-size:1.05rem}
.intro{display:flex;flex-direction:column;gap:18px;max-width:1100px}
.intro-topic{display:inline-block;align-self:flex-start;background:var(--tape);color:var(--tape-ink);font-family:var(--f-display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.3em .8em;border-radius:8px;font-size:clamp(.9rem,1.4vw,1.2rem)}

.intro .lead{font-size:clamp(1.1rem,1.7vw,1.45rem);max-width:60ch}

.intro-plan ul{padding-left:1.3rem;margin-top:6px;display:grid;gap:4px}
.hd-clock{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;padding:.1em .5em;border:2px solid var(--ink);border-radius:10px}

.hdq{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}

.hdo-c.ok{border-color:var(--safe);background:var(--safe-soft)}.hdo-c.ok .hdo-k{background:var(--safe);border-color:var(--safe);color:#fff}
.hdo-c.no{border-color:var(--danger);background:var(--danger-soft)}.hdo-c.no .hdo-k{background:var(--danger);border-color:var(--danger);color:#fff}
.hdo-g{margin-top:4px;font-weight:700;animation:introIn .4s ease both}
.hdq-a{font-size:1.05rem;background:var(--safe-soft);border-radius:10px;padding:.6em .8em;animation:introIn .4s ease both}
.hdq-l{margin-top:6px;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.armor{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.armor{grid-template-columns:minmax(0,1fr)}}
.arm{display:flex;flex-direction:column;gap:8px;border-radius:var(--r);padding:18px;border:1px solid var(--line);background:var(--panel)}

.arm.cham .arm-ic{background:var(--warn-soft);color:var(--warn)}

.arm.kg .arm-ic{background:var(--danger-soft);color:var(--danger)}
.arm h3{font-size:1.78rem}

.arm ul{padding-left:1.1rem;display:grid;gap:4px;font-size:1rem}
.gold{font-size:1rem;color:var(--muted)}

/* link x-ray */
.xform{display:flex;gap:8px;flex-wrap:wrap}
.xform input{flex:1 1 240px;min-width:0;padding:.68em .85em;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-family:var(--f-mono);font-size:1rem;font-weight:600}

.opts{display:grid;gap:8px}

/* filter */

.thr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel-2)}

.met{padding:12px;border-radius:12px;background:var(--panel-2);display:flex;flex-direction:column;gap:4px}

.met span{font-size:.8rem;color:var(--muted);font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.tile{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:.6em .75em;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:.94rem;min-height:72px;box-sizing:border-box}

.tile.o-tp{border-color:var(--safe)}.tile.o-tp .tb{color:var(--safe)}
.tile.o-tn .tb{color:var(--safe)}
.tile.o-fn{border-color:var(--danger);background:var(--danger-soft)}.tile.o-fn .tb{color:var(--danger)}
.tile.o-fp{border-color:var(--warn);background:var(--warn-soft)}.tile.o-fp .tb{color:var(--warn)}

.tleg .o-fn::before{border-color:var(--danger);background:var(--danger-soft)}
.tleg .o-fp::before{border-color:var(--warn);background:var(--warn-soft)}
.badge{display:inline-block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:.15em .5em;border-radius:6px}
.badge.lua{background:var(--danger-soft);color:var(--danger)}
.badge.that{background:var(--safe-soft);color:var(--safe)}
.fchip{display:inline-block;font-size:.8rem;padding:.15em .55em;border-radius:999px;border:1px solid var(--line);margin:2px 2px 0 0;color:var(--muted)}
.fchip.on{border-color:var(--ink);color:var(--ink);font-weight:700}
.fverdict{font-weight:700}
details.why{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem}

/* wrap-up */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}

.pledge-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(14px,2vw,24px);align-items:start}

.pcard{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);max-width:480px}

.pc-in{padding:20px;display:flex;flex-direction:column;gap:10px}

.pc-in ul{padding-left:1.1rem;display:grid;gap:4px}

function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}return AC;}
function tone(f,d,type,v,delay){if(!S.sound)return;var c=ac();if(!c)return;var t=c.currentTime+(delay||0);var o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);}
function sweep(f1,f2,d,v,type,delay){if(!S.sound)return;var c=ac();if(!c)return;var t=c.currentTime+(delay||0);var o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);}
function sTick(hot){tone(hot?1320:880,.05,'triangle',.05);}
function sClock(tac){tone(tac?620:880,.035,'triangle',.09);}
function sGong(){tone(523,1.4,'sine',.13);tone(784,1.1,'sine',.07,.01);tone(1046,.8,'sine',.04,.02);tone(262,1.2,'triangle',.06);}
function sStamp(){sweep(160,55,.28,.22,'sine');tone(90,.12,'square',.05);}
function sWrong(){sweep(330,170,.28,.09,'triangle');}
function sBuzz(){sWrong();}
function sChime(){tone(784,.18,'sine',.08);tone(988,.18,'sine',.08,.1);tone(1319,.35,'sine',.07,.2);}
function sPop(){tone(1319,.12,'sine',.08);tone(1760,.18,'sine',.06,.07);}
function sWhoosh(){sweep(180,1400,.55,.07,'sawtooth');sweep(240,1700,.55,.05,'sine',.02);}
function sFanfare(){[523,659,784,1046].forEach(function(f,i){tone(f,.22,'triangle',.08,i*.11);});tone(1046,.6,'sine',.06,.44);}

/* ---------- link analysis ---------- */
var PSL2=['com.vn','net.vn','org.vn','edu.vn','gov.vn','ac.vn','biz.vn','info.vn','name.vn','pro.vn','health.vn','int.vn','co.uk','org.uk','ac.uk','com.au','co.jp','com.sg','co.kr'];
var KNOWN=[
 {d:'mayxanhbank.vn',n:'Ngân hàng Mây Xanh (giả định trong bài)'},
 {d:'veoshop.vn',n:'Sàn VèoShop (giả định trong bài)'},
 {d:'dichvucong.gov.vn',n:'Cổng Dịch vụ công quốc gia'},
 {d:'chinhphu.vn',n:'Cổng Thông tin điện tử Chính phủ'},
 {d:'moet.gov.vn',n:'Bộ Giáo dục và Đào tạo'},
 {d:'google.com',n:'Google'},{d:'google.com.vn',n:'Google Việt Nam'},{d:'youtube.com',n:'YouTube'},{d:'facebook.com',n:'Facebook'}
];
var SHORT=['bit.ly','tinyurl.com','t.ly','rb.gy','cutt.ly','shorturl.at','is.gd','goo.gl','s.id','t.co','tiny.cc','ow.ly'];
var RISKY=['top','xyz','vip','click','site','online','icu','buzz','cyou','sbs','lol','rest','monster','tk','ml','ga','cf','gq','cc','live','fun'];
var BAIT=['xacthuc','xac-thuc','dangnhap','dang-nhap','login','verify','capnhat','cap-nhat','baomat','bao-mat','hotro','ho-tro','nhanqua','nhan-qua','trungthuong','trung-thuong','dinhdanh','dinh-danh','vneid','secure','update','account'];
var CONF={'а':'a','е':'e','о':'o','р':'p','с':'c','у':'y','х':'x','і':'i','ј':'j','ѕ':'s','ԁ':'d','ο':'o','α':'a','ν':'v','ρ':'p','ι':'i','κ':'k'};
function deconf(s){return Array.prototype.map.call(s,function(c){return CONF[c]||c;}).join('');}
function normLook(s){return deconf(s.toLowerCase()).replace(/rn/g,'m').replace(/vv/g,'w').replace(/0/g,'o').replace(/1/g,'l').replace(/3/g,'e').replace(/5/g,'s');}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i];}for(j=0;j<=n;j++){d[0][j]=j;}for(i=1;i<=m;i++){for(j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));}}return d[m][n];}
function regOf(host){var lab=host.split('.');if(lab.length<2)return {reg:host,sub:''};var last2=lab.slice(-2).join('.');var n=(PSL2.indexOf(last2)>=0&&lab.length>=3)?3:2;return {reg:lab.slice(-n).join('.'),sub:lab.slice(0,-n).join('.')};}
function analyze(raw){
 var s=String(raw||'').trim();if(!s)return null;
 var noScheme=false;
 if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)){s='https://'+s;noScheme=true;}
 var u;try{u=new URL(s);}catch(e){return {error:'Máy chưa đọc được đường link này. Kiểm tra lại dấu chấm và dấu gạch chéo.'};}
 var host=u.hostname.toLowerCase().replace(/\.$/,'');
 var mm=s.match(/^[a-z][a-z0-9+.-]*:\/\/(?:[^@\/?#]*@)?([^\/?#:]+)/i);
 var rawHost=(mm?mm[1]:host).toLowerCase();
 var isIP=/^\d{1,3}(\.\d{1,3}){3}$/.test(host)||host.charAt(0)==='[';
 if(!isIP&&host.indexOf('.')<0)return {error:'“'+host+'” chưa phải một tên miền đầy đủ (thiếu phần đuôi như .vn, .com).'};
 var r=isIP?{reg:host,sub:''}:regOf(host);
 var rr=isIP?{reg:rawHost,sub:''}:regOf(rawHost);
 var tld=host.split('.').pop();
 var flags=[],risk=0;
 var known=null;KNOWN.forEach(function(k){if(k.d===r.reg)known=k;});
 if(u.username||u.password){flags.push({lv:'danger',t:'Có dấu @: phần “'+decodeURIComponent(u.username)+'” đứng trước bị trình duyệt bỏ qua. Trang thật được mở là '+host+'.'});risk+=3;}
 if(u.protocol==='http:'){flags.push({lv:'warn',t:'Dùng http: dữ liệu em gõ vào không được mã hóa.'});risk+=1;}
 if(isIP){flags.push({lv:'danger',t:'Dùng địa chỉ IP thay cho tên miền. Trang chính thức gần như không bao giờ làm vậy.'});risk+=3;}
 var odd=Array.prototype.filter.call(rawHost,function(ch){return ch.charCodeAt(0)>127;});
 var puny=odd.length>0||host.indexOf('xn--')>=0;
 if(puny){flags.push({lv:'danger',t:'Có ký tự lạ trông giống chữ Latinh'+(odd.length?': '+odd.map(function(c){return '“'+c+'” (mã U+'+c.charCodeAt(0).toString(16).toUpperCase()+')';}).join(', '):'')+'. Máy tính đọc tên miền thành '+host+'.'});risk+=3;}
 if(SHORT.indexOf(r.reg)>=0){flags.push({lv:'warn',t:'Link rút gọn: không nhìn thấy đích đến thật. Hãy xem trước đích đến trước khi mở.'});risk+=2;}
 if(!known&&!isIP){
  var hitSub=null,hitReg=null,look=null;
  KNOWN.forEach(function(k){
   var brand=k.d.split('.')[0];
   if(!hitSub&&r.sub&&(r.sub.indexOf(k.d)>=0||r.sub.split('.').indexOf(brand)>=0||r.sub.indexOf(brand+'-')>=0))hitSub=k;
   if(!hitReg&&brand.length>=5&&r.reg.split('.')[0].indexOf(brand)>=0)hitReg=k;
   var nl=normLook(rr.reg);
   if(!look&&(nl===k.d||(r.reg.length>6&&Math.abs(r.reg.length-k.d.length)<=2&&lev(r.reg,k.d)<=2)))look=k;
  });
  if(hitSub){flags.push({lv:'danger',t:'Tên miền con mạo danh “'+hitSub.d+'”. Phần này do chủ trang tự đặt, không chứng minh điều gì.'});risk+=3;}
  if(look){var how=/rn/.test(rr.reg)?' (“rn” giả chữ “m”)':(puny?' (chữ cái của bảng chữ cái khác)':/[0135]/.test(rr.reg)?' (số giả chữ cái)':'');flags.push({lv:'danger',t:'Trông gần giống tên miền chính thức '+look.d+how+', nhưng là một tên miền khác.'});risk+=3;}
  else if(hitReg){flags.push({lv:'danger',t:'Tên miền có chữ “'+hitReg.d.split('.')[0]+'” nhưng không phải tên miền chính thức '+hitReg.d+'.'});risk+=2;}
 }
 var baitHit=BAIT.filter(function(b){return host.indexOf(b)>=0;});
 if(baitHit.length&&!known){flags.push({lv:'warn',t:'Tên miền chứa từ khóa dụ dỗ: '+baitHit.slice(0,3).join(', ')+'.'});risk+=1;}
 if(RISKY.indexOf(tld)>=0&&!known){flags.push({lv:'warn',t:'Đuôi .'+tld+' rẻ, dễ đăng kí nên hay bị dùng trong các vụ lừa đảo. Cần cảnh giác hơn.'});risk+=1;}
 if(!isIP&&(r.reg.split('.')[0].match(/-/g)||[]).length>=2&&!known){flags.push({lv:'warn',t:'Tên miền có nhiều dấu gạch ngang, kiểu thường gặp ở trang giả.'});risk+=1;}
 if(noScheme)flags.push({lv:'info',t:'Link không ghi giao thức, máy tạm coi là https://.'});
 if(u.protocol==='https:'&&risk>0)flags.push({lv:'info',t:'Có https (ổ khóa) chưa chắc an toàn: trang lừa đảo cũng dùng https.'});
 var v;
 if(known&&risk===0)v={lv:'safe',t:'Khớp tên miền chính thức: '+known.n};
 else if(risk>=3)v={lv:'danger',t:'Nguy hiểm: nhiều khả năng là trang giả mạo'};
 else if(risk>=1)v={lv:'warn',t:'Đáng ngờ: cần kiểm tra thêm trước khi mở'};
 else v={lv:'neutral',t:'Chưa thấy dấu hiệu rõ, nhưng đây không phải tên miền chính thức máy biết. Hãy đối chiếu với trang chính thức.'};
 var rest=(u.pathname==='/'?'':u.pathname)+u.search+u.hash;
 return {scheme:noScheme?'':u.protocol+'//',user:u.username?decodeURIComponent(u.username):'',sub:r.sub,reg:r.reg,rest:rest,host:host,rawHost:rawHost,puny:puny,flags:flags,v:v,risk:risk};
}
function seg(c,txt,lab){return '<span class="sg '+c+'"><code>'+esc(txt)+'</code><small>'+lab+'</small></span>';}
function xrayHTML(r){
 if(!r)return '';

 var segs=[];

  '<div class="seglist">'+segs.join('')+'</div>'+

  '<div class="vpill '+r.v.lv+'">'+icon(vic)+'<span>'+esc(r.v.t)+'</span></div>'+
  (r.flags.length?'<ul class="flags">'+r.flags.map(function(f){return '<li class="flag '+f.lv+'">'+icon(f.lv==='info'?'search':'alert')+'<span>'+esc(f.t)+'</span></li>';}).join('')+'</ul>':'')+
 '</div>';
}

function fitZoom(){
 var el=ZM.el,b=$('#zo-body'),fit=$('#zo-fit');if(!el||!b)return;
 var dw=+(el.getAttribute('data-zw')||900);
 fit.style.zoom=1;fit.style.width=dw+'px';
 var W=b.clientWidth-32,H=b.clientHeight-32,h=fit.scrollHeight||1;

function warmStart(){
 var w=S.warm;ac();w.ph='count';drawWarm();
 var total=w.secs*1000,t0=performance.now(),last=w.secs,C=2*Math.PI*52,nextBeep=0;

 function step(now){
  var left=Math.max(0,total-(now-t0)),sec=Math.ceil(left/1000);
  var fg=$('#ringfg'),num=$('#ringnum');
  if(!fg||S.view!=='warm'){w.raf=0;return;}
  fg.style.strokeDashoffset=String(C*(1-left/total));
  if(left<=2000)fg.classList.add('hot');
  if(sec!==last){last=sec;if(num)num.textContent=sec;}
  var el=now-t0;
  if(left>0&&el>=nextBeep){var hot=left<=2000;sClock(Math.floor(el/(hot?250:500))%2===1);if(hot)tone(1180,.04,'sine',.05);nextBeep=el+(hot?250:500);}
  if(left<=0){w.raf=0;sGong();w.ph='raise';drawWarm();return;}
  w.raf=requestAnimationFrame(step);
 }
 w.raf=requestAnimationFrame(step);
}

function reportHTML(c,st){
 var res=st.res;
 var typeH=TYPES.map(function(t){var ch=st.rep.type===t.k;var cls=res?(t.k===c.type?' right':(ch?' wrong':'')):'';return '<label class="choice'+cls+'" for="rt-'+c.id+'-'+t.k+'"><input type="radio" name="rt-'+c.id+'" id="rt-'+c.id+'-'+t.k+'" data-rep="type" data-k="'+t.k+'"'+(ch?' checked':'')+'><span>'+t.l+'</span></label>';}).join('');
 var okSet=c.emo.req.concat(c.emo.ok);
 var emoH=EMOS.map(function(e){var ch=st.rep.emo.indexOf(e.k)>=0;var cls=res?(c.emo.req.indexOf(e.k)>=0?' right':(ch&&okSet.indexOf(e.k)<0?' wrong':'')):'';return '<label class="choice'+cls+'" for="re-'+c.id+'-'+e.k+'"><input type="checkbox" id="re-'+c.id+'-'+e.k+'" data-rep="emo" data-k="'+e.k+'"'+(ch?' checked':'')+'><span>'+e.l+'</span></label>';}).join('');
 var actH=st.order.map(function(i){var a=c.acts[i];var ch=st.rep.acts.indexOf(i)>=0;var cls=res?(a.ok?' right':(ch?' wrong':'')):'';return '<label class="choice'+cls+'" for="ra-'+c.id+'-'+i+'"><input type="checkbox" id="ra-'+c.id+'-'+i+'" data-rep="acts" data-k="'+i+'"'+(ch?' checked':'')+'><span>'+a.t+(res&&a.ok?'<span class="ptag">'+PTAG[a.ok]+'</span>':'')+'</span></label>';}).join('');
 return '<form id="rep" class="stack" data-c="'+c.id+'">'+

  '<div class="row"><button class="btn primary big" type="submit">'+(res?'Nộp lại báo cáo':'Nộp báo cáo sự cố')+'</button></div></form>'+
  '<div id="repres" aria-live="polite">'+(res?resultHTML(c,st):'')+'</div>';
}
function scoreCase(c,st){
 var evPts=Math.round(st.found.length/c.ev.length*40);
 var typeOk=st.rep.type===c.type,typePts=typeOk?20:0;
 var okSet=c.emo.req.concat(c.emo.ok),emo=st.rep.emo;
 var allReq=c.emo.req.every(function(k){return emo.indexOf(k)>=0;});
 var noWrong=emo.every(function(k){return okSet.indexOf(k)>=0;});
 var anyReq=c.emo.req.some(function(k){return emo.indexOf(k)>=0;});
 var emoPts=allReq&&noWrong?15:(anyReq?8:0);
 var good=0,bad=0;st.rep.acts.forEach(function(i){if(c.acts[i].ok)good++;else bad++;});
 var actPts=Math.max(0,Math.round((good-bad)*25/3));
 return {evPts:evPts,typePts:typePts,emoPts:emoPts,actPts:actPts,total:evPts+typePts+emoPts+actPts,typeOk:typeOk,emoFull:allReq&&noWrong,good:good,bad:bad};
}

function budgetLeft(c,st){return c.ev.length+1-(st.clk||0)-(st.miss||0);}

function updBudget(c,st){var b=$('#budget');if(b){b.innerHTML=budgetHTML(c,st);b.classList.toggle('out',budgetLeft(c,st)<=0);}var d=$('#device');if(d)d.classList.toggle('spent',S.mode==='hs'&&budgetLeft(c,st)<=0);}
function caseMiss(){
 var c=caseById(S.caseId);if(!c)return;var st=cst(c.id);
 if(budgetLeft(c,st)<=0){toast('Hết lượt chạm. Hãy dùng công cụ kiểm chứng và nộp báo cáo.');return;}
 st.miss=(st.miss||0)+1;sBuzz();updBudget(c,st);
 toast(budgetLeft(c,st)<=0?'Chạm sai! Hết lượt chạm, hãy dùng công cụ kiểm chứng và nộp báo cáo.':'Chạm sai! Chỗ này không phải bằng chứng. Còn '+budgetLeft(c,st)+' lượt.');
}
function findEv(eid,viaTool){
 var c=caseById(S.caseId);if(!c)return;var st=cst(c.id);
 var idx=-1;c.ev.forEach(function(e,k){if(e.id===eid)idx=k;});if(idx<0)return;
 if(st.found.indexOf(eid)<0&&S.mode==='hs'&&!viaTool){
  if(budgetLeft(c,st)<=0){toast('Hết lượt chạm. Hãy dùng công cụ kiểm chứng và nộp báo cáo.');sBuzz();return;}
  st.clk=(st.clk||0)+1;updBudget(c,st);
 }
 if(st.found.indexOf(eid)<0){
  st.found.push(eid);sPop();
  $$('.hs[data-ev="'+eid+'"]').forEach(function(b){b.classList.add('found');b.classList.remove('missed');b.setAttribute('data-n',idx+1);});
  var li=$('#ev-'+c.id+'-'+eid);if(li){li.classList.add('got');li.innerHTML=evInner(c,idx,true);}
  var cnt=$('#evcount');if(cnt)cnt.textContent=st.found.length+'/'+c.ev.length;
  toast('Bằng chứng '+(idx+1)+': '+c.ev[idx].t);
  if(st.found.length===c.ev.length){setTimeout(function(){toast('Đã đủ '+c.ev.length+'/'+c.ev.length+' bằng chứng. Hoàn thành báo cáo sự cố!');sChime();},900);}
 }else{
  var l2=$('#ev-'+c.id+'-'+eid);if(l2){l2.classList.add('flash');setTimeout(function(){l2.classList.remove('flash');},600);}
 }
}
function useTool(tid){
 var c=caseById(S.caseId);if(!c)return;var st=cst(c.id);
 var t=c.tools.filter(function(x){return x.id===tid;})[0];if(!t)return;
 var i=st.tools.indexOf(tid);if(i>=0)st.tools.splice(i,1);else{st.tools.push(tid);sPop();}
 var w=$('#tw-'+tid);if(w)w.outerHTML=toolHTML(c,t,st);
 if(i<0&&t.ev)setTimeout(function(){findEv(t.ev,true);},250);
}

  '<fieldset><legend class="sr">Lời hứa</legend>'+PLEDGES.map(function(p,i){return '<label class="choice" for="pl-'+i+'"><input type="checkbox" id="pl-'+i+'" data-pl="'+i+'"'+(S.pledge.p.indexOf(i)>=0?' checked':'')+'><span>'+p+'</span></label>';}).join('')+'</fieldset></form></div>'+
  '<div class="stack"><div id="pcard" data-zoom="Thẻ thám tử mạng" data-zw="500">'+pledgeCard()+'</div><div class="row"><button class="btn primary big" data-act="pledge-send">Gửi lời hứa cho thầy cô</button></div>'+
  '<div class="card stack" data-zoom="Nhiệm vụ về nhà" data-zw="620"><h3>Nhiệm vụ về nhà</h3><ol class="hw"><li>Thực hiện lời hứa trên thẻ cùng người thân.</li><li>Sưu tầm 1 tình huống tin nhắn lừa đảo (che thông tin cá nhân) và đọc trước Mục 2 SGK cho Tiết 2.</li></ol></div></div></div>'+
 '</section>';
};
function pledgeCard(){
 var P=S.pledge,d=new Date();
 var ds=d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
 return '<div class="pcard"><div class="tape"></div><div class="pc-in"><div class="eyebrow">Thẻ thám tử mạng · Tin học 11</div><div class="pc-name">'+esc(P.name||'Thám tử ẩn danh')+'</div>'+
  (P.p.length?'<div class="small"><b>Cam kết:</b></div><ul>'+P.p.map(function(i){return '<li>'+PLEDGES[i]+'</li>';}).join('')+'</ul>':'<p class="muted small">Chọn ít nhất 1 lời hứa ở bên cạnh.</p>')+
  '<div class="small muted">Bộ giáp 3 lớp: Chậm lại · Kiểm tra · Không gửi · '+ds+'</div></div></div>';
}

/* ---------- render ---------- */
function stopTimers(){if(S.warm.raf){cancelAnimationFrame(S.warm.raf);S.warm.raf=0;if(S.warm.ph==='count')S.warm.ph='ready';}timers.forEach(function(t){clearInterval(t);});timers=[];}
function setHash(){var h='#hs'+(S.view!=='home'?'-'+S.view:'')+(S.view==='case'&&S.caseId?'-'+S.caseId:'');if(location.hash!==h){try{history.replaceState(null,'',h);}catch(e){}}}
function parseHash(){var h=(location.hash||'').slice(1);var m=h.match(/^(?:gv|hs)(?:-(home|warm|link|case|filter|wrap|track))?(?:-(c[1-5]))?$/);if(m){S.view=(m[1]==='link'?'case':(m[1]||'home'));S.caseId=m[2]||null;}S.mode='hs';if(S.view==='warm'||S.view==='track')S.view='home';}
function render(){
 stopTimers();
 closeNote(true);
 closeZoom();
 var tb=$('#toasts');if(tb)tb.innerHTML='';
 document.body.classList.toggle('mode-hs',S.mode==='hs');
 $('#bar').innerHTML=barHTML();
 $('#main').innerHTML=(VIEWS[S.view]||VIEWS.home)();
 if(AFTER[S.view])AFTER[S.view]();
 zoomBtns();
 setHash();
}
function go(v,c){if(v==='link')v='case';S.view=v||'home';S.caseId=(S.view==='case'&&c)?c:null;render();window.scrollTo(0,0);}

/* ---------- actions ---------- */
var ACT={
 'view-report':function(t){var cId=t.getAttribute('data-c')||S.caseId;openReportModal(cId);},
 'close-report':function(){closeReportModal();},
 'print-report':function(){window.print();},
 'toggle-pres-report':function(){toggleReportFullscreen();},
 go:function(t){go(t.getAttribute('data-v'),t.getAttribute('data-c'));},
 sound:function(){toggleSound();},
 theme:function(){var n=effTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);store.set('theme',n);$('#bar').innerHTML=barHTML();},
 full:function(){toggleFull();},
 'warm-main':function(){warmMain();},
 'warm-secs':function(t){S.warm.secs=parseInt(t.getAttribute('data-n'),10);store.set('secs',S.warm.secs);drawWarm();},
 'warm-restart':function(){S.warm.i=0;S.warm.ph='ready';S.warm.armor=false;S.warm.hdAns=false;drawWarm();},
 'warm-intro':function(){S.warm.ph='intro';sFanfare();drawWarm();window.scrollTo(0,0);},
 'warm-back':function(){S.warm.ph='twist';drawWarm();},
 hd1:function(){S.warm.ph='hd1';sWhoosh();drawWarm();window.scrollTo(0,0);},
 'zoom':function(t){openZoom(+t.getAttribute('data-i'));},
 'zoom-nav':function(t){if(ZM.i<0)return;openZoom(ZM.i+(+t.getAttribute('data-d')));},
 'zoom-size':function(t){ZM.k=Math.max(.5,Math.min(2.5,ZM.k*(t.getAttribute('data-d')==='1'?1.15:1/1.15)));fitZoom();},
 'zoom-close':function(){closeZoom();},
 'hd1-ans':function(){S.warm.hdAns=true;sChime();var y=window.scrollY;drawWarm();window.scrollTo(0,y);},
 'hd1-timer':function(){
  if(hdTimer){clearInterval(hdTimer);hdTimer=null;var b0=$('#hdtbtn');if(b0)b0.textContent='Bấm giờ 1 phút';var c0=$('#hdclock');if(c0){c0.textContent='1:00';c0.classList.remove('hot');}return;}
  hdLeft=60;var b=$('#hdtbtn');if(b)b.textContent='Dừng bấm giờ';sPop();
  hdTimer=setInterval(function(){hdLeft--;var left=hdLeft;var c=$('#hdclock');if(!c){clearInterval(hdTimer);hdTimer=null;return;}
   c.textContent=Math.floor(left/60)+':'+('0'+left%60).slice(-2);if(left<=10){c.classList.add('hot');sClock(left%2);}
   if(left<=0){clearInterval(hdTimer);hdTimer=null;c.textContent='Hết giờ!';sGong();var bb=$('#hdtbtn');if(bb)bb.textContent='Bấm giờ 1 phút';}},1000);
 },
 armor:function(){S.warm.armor=true;sChime();drawWarm();},
 xchip:function(t){var u=t.getAttribute('data-u');var inp=$('#xin');if(inp)inp.value=u;S.link.x=u;$('#xout').innerHTML=xrayHTML(analyze(u));},
 pick:function(t){var L=S.link;if(L.picked!==null)return;L.picked=parseInt(t.getAttribute('data-j'),10);var okp=L.order[L.i][L.picked].ok;L.res[L.i]=okp?1:0;if(okp){L.score++;sChime();}else{sBuzz();}drawChal();},
 next:function(){var L=S.link;L.picked=null;if(L.i<LINKS.length-1)L.i++;else{L.done=true;sendResult('soi-link',L.score,LINKS.length,{kq:LINKS.map(function(_,k){return L.res[k]?1:0;}).join('')});}drawChal();var ch=$('#chal');if(ch&&ch.getBoundingClientRect().top<0&&ch.scrollIntoView)ch.scrollIntoView({block:'start'});},
 'link-reset':function(){S.link.i=0;S.link.score=0;S.link.picked=null;S.link.done=false;S.link.order=null;S.link.res=[];drawChal();},
 ev:function(t){findEv(t.getAttribute('data-ev'));},
 tool:function(t){useTool(t.getAttribute('data-t'));},
 hint:function(t){var st=cst(S.caseId);st.hint=!st.hint;var d=$('#device');if(d)d.classList.toggle('hint',st.hint);t.setAttribute('aria-pressed',String(st.hint));t.textContent=st.hint?'Ẩn gợi ý':'Gợi ý chỗ cần soi';},
 th:function(t){var F=S.filter;var mx=Math.max(1,F.f.length);F.th=Math.min(mx,Math.max(1,F.th+parseInt(t.getAttribute('data-d'),10)));var o=$('#thv');if(o)o.textContent=F.th;},
 run:function(){runFilter();},
 tile:function(t){var F=S.filter;F.sel=parseInt(t.getAttribute('data-i'),10);$$('.tile.sel').forEach(function(x){x.classList.remove('sel');});t.classList.add('sel');var d=$('#tdetail');if(d)d.innerHTML=tileDetail(F.sel);},
 'qr-big':function(){openQR();},
 qr:function(){drawQR();},
 copy:function(){var v=studentLink();if(!v){toast('Chưa có link để sao chép.');return;}try{navigator.clipboard.writeText(v).then(function(){toast('Đã sao chép link cho học sinh.');},function(){toast('Không sao chép được, hãy chọn link và nhấn Ctrl + C.');});}catch(e){toast('Không sao chép được, hãy chọn link và nhấn Ctrl + C.');}},
 'note-zoom':function(t){openNote(t.getAttribute('data-k'));},
 'note-close':function(){closeNote();},
 'note-size':function(t){NZ.sc=Math.max(.7,Math.min(1.8,Math.round((NZ.sc+0.15*parseInt(t.getAttribute('data-d'),10))*100)/100));store.set('notefs',NZ.sc);applyNoteSize();},
 'tr-sample':function(){TR.sample=true;drawTrack();},
 'tr-sample-off':function(){TR.sample=false;drawTrack();trackFetch();},
 'tr-hsfile':function(){downloadHs();},
 'tr-clear':function(t){clearTrack(t);},
 'pledge-send':function(){var P=S.pledge;if(!P.p.length){toast('Chọn ít nhất 1 lời hứa.');return;}if(sendResult('loi-hua',P.p.length,PLEDGES.length,{p:P.p.join(',')}))toast('Đang gửi lời hứa…');else toast('Máy này chưa kết nối bảng theo dõi. Hãy chụp màn hình thẻ.');}
};
function toggleSound(){S.sound=!S.sound;store.set('sound_'+S.mode,S.sound);if(S.sound)ac();$('#bar').innerHTML=barHTML();toast(S.sound?'Đã bật âm thanh':'Đã tắt âm thanh');}
function toggleFull(){var d=document,el=d.documentElement;try{if(!d.fullscreenElement){var p=el.requestFullscreen&&el.requestFullscreen();if(p&&p.catch)p.catch(function(){toast('Trình duyệt không cho phép toàn màn hình ở đây.');});else if(!p)toast('Trình duyệt không cho phép toàn màn hình ở đây.');}else if(d.exitFullscreen){d.exitFullscreen();}}catch(e){toast('Trình duyệt không cho phép toàn màn hình ở đây.');}}

document.addEventListener('click',function(e){if(S.view!=='case'||!S.caseId||S.mode!=='hs')return;if(!e.target.closest||!e.target.closest('#device'))return;if(e.target.closest('.hs'))return;var x=e.clientX,y=e.clientY,near=null;$$('#device .hs').forEach(function(h){if(near)return;Array.prototype.forEach.call(h.getClientRects(),function(r){if(x>=r.left-8&&x<=r.right+8&&y>=r.top-6&&y<=r.bottom+6)near=h;});});e.stopPropagation();if(near){findEv(near.getAttribute('data-ev'));return;}caseMiss();},true);
document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var f=ACT[t.getAttribute('data-act')];if(f){e.preventDefault();f(t,e);}});
document.addEventListener('submit',function(e){var f=e.target;if(f.id==='xform'){e.preventDefault();var v=$('#xin').value;S.link.x=v;$('#xout').innerHTML=xrayHTML(analyze(v));}else if(f.id==='rep'){e.preventDefault();submitReport();}else if(f.id==='pform'){e.preventDefault();}else if(f.id==='meform'){e.preventDefault();saveMe();}else if(f.id==='trform'){e.preventDefault();saveTrack();}});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.id==='tr-anon'){TR.anon=t.checked;store.set('anon',TR.anon);drawTrack();return;}
 if(t.hasAttribute('data-feat')){var F=S.filter,k=t.getAttribute('data-feat');var i=F.f.indexOf(k);if(t.checked&&i<0)F.f.push(k);if(!t.checked&&i>=0)F.f.splice(i,1);var mx=Math.max(1,F.f.length);if(F.th>mx){F.th=mx;var o=$('#thv');if(o)o.textContent=F.th;}}
 else if(t.hasAttribute('data-rep')){var st=cst(S.caseId),kind=t.getAttribute('data-rep'),key=t.getAttribute('data-k');
  if(kind==='type')st.rep.type=key;
  else{var arr=st.rep[kind];var val=kind==='acts'?parseInt(key,10):key;var j=arr.indexOf(val);if(t.checked&&j<0)arr.push(val);if(!t.checked&&j>=0)arr.splice(j,1);}}
 else if(t.hasAttribute('data-pl')){var P=S.pledge,n=parseInt(t.getAttribute('data-pl'),10),q=P.p.indexOf(n);if(t.checked&&q<0)P.p.push(n);if(!t.checked&&q>=0)P.p.splice(q,1);P.p.sort();$('#pcard').innerHTML=pledgeCard();zoomBtns();if(ZM.el)fitZoom();}
});
document.addEventListener('input',function(e){if(e.target.id==='pname'){S.pledge.name=e.target.value;$('#pcard').innerHTML=pledgeCard();zoomBtns();if(ZM.el)fitZoom();}});
document.addEventListener('toggle',function(e){if(e.target.id==='whybox')S.filter.why=e.target.open;},true);
document.addEventListener('keydown',function(e){
 if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click();return;}
 if(e.target.closest&&e.target.closest('input,textarea,select'))return;
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 var k=e.key;
 if($('#rep-modal-overlay')&&$('#rep-modal-overlay').style.display!=='none'){if(k==='Escape'){closeReportModal();return;}}
 if($('#zoomover')){
  if(k==='Escape'||k==='z'||k==='Z'){closeZoom();return;}
  if(k==='ArrowRight'||k==='ArrowLeft'){e.preventDefault();ACT['zoom-nav']({getAttribute:function(){return k==='ArrowRight'?'1':'-1';}});return;}
  if(k==='+'||k==='='||k==='-'){ACT['zoom-size']({getAttribute:function(){return k==='-'?'-1':'1';}});return;}
  if(/^[1-9]$/.test(k)){openZoom(+k-1);return;}
 }
 if(S.mode==='gv'&&/^[1-9]$/.test(k)&&!$('#noteover')&&!$('#qrover')){var zl=zoomList();if(zl.length&&+k<=zl.length){openZoom(+k-1);return;}}
 if(S.mode==='gv'&&(k==='z'||k==='Z')&&zoomList().length){openZoom(0);return;}
 if(k==='Escape'&&$('#qrover')){closeQR();return;}
 if(k==='q'||k==='Q'){if($('#qrover'))closeQR();else openQR();return;}
 if(k==='Escape'&&$('#noteover')){closeNote();return;}
 if($('#noteover')&&(k==='+'||k==='=')){ACT['note-size']({getAttribute:function(){return '1';}});return;}
 if($('#noteover')&&k==='-'){ACT['note-size']({getAttribute:function(){return '-1';}});return;}
 if(k==='g'||k==='G'){if($('#noteover')){closeNote();return;}var z=$('.note-zoom');if(z)openNote(z.getAttribute('data-k'));else if(S.mode==='gv')toast('Phần này chưa có nội dung ghi bài.');return;}
 if(k==='f'||k==='F'){toggleFull();return;}
 if(k==='m'||k==='M'){toggleSound();return;}

 if(S.view==='warm'&&(k===' '||k==='Enter'||k==='ArrowRight')){if(e.target.closest&&e.target.closest('button,a'))return;e.preventDefault();if(S.warm.ph!=='count'&&S.warm.ph!=='twist')warmMain();}
});
window.addEventListener('hashchange',function(){var before=S.view+S.caseId;parseHash();if(before!==S.view+S.caseId)render();});

/* ---------- boot ---------- */
var th=store.get('theme',null);if(th)document.documentElement.setAttribute('data-theme',th);
parseHash();
S.sound=store.get('sound_'+S.mode,S.mode==='gv');
render();
if(SQ.q.length)setTimeout(flush,1500);
})();
</script>
</body></html>
